apiVersion: v1
kind: Service
metadata:
  name: disk-api
  namespace: disk
  labels:
    app.kubernetes.io/name: disk
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: disk
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: disk
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: disk-worker
  namespace: disk
  labels:
    app.kubernetes.io/name: disk
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: disk
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: disk
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disk
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: disk
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/job: disk-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: disk-runtime
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: disk
                  app.kubernetes.io/component: worker
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: disk
              app.kubernetes.io/component: worker
      containers:
        - name: disk
          image: disk-backend:replace-with-reviewed-tag
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DISK_INSTANCE_ID="${DISK_PROCESS_ROLE}-${HOSTNAME}-$(cat /proc/sys/kernel/random/uuid)"
              export DISK_INSTANCE_ID
              exec /app/disk
          envFrom:
            - configMapRef:
                name: disk-runtime-config
          env:
            - name: DISK_PROCESS_ROLE
              value: worker
            - name: DISK_WORKER_CLAIMING_ENABLED
              value: "true"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: DATABASE_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: JWT_SECRET
            - name: DISK_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: DISK_S3_ACCESS_KEY
            - name: DISK_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: DISK_S3_SECRET_KEY
            - name: DISK_S3_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: disk-runtime-secrets
                  key: DISK_S3_SESSION_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime-data
              mountPath: /var/lib/disk
            - name: tmp
              mountPath: /tmp
        - name: redis-tls-proxy
          image: haproxy:replace-with-reviewed-tag
          imagePullPolicy: IfNotPresent
          args:
            - -W
            - -db
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          envFrom:
            - configMapRef:
                name: disk-runtime-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: redis-tls-proxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
            - name: redis-ca
              mountPath: /etc/disk/redis-ca
              readOnly: true
      volumes:
        - name: runtime-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: redis-tls-proxy-config
          configMap:
            name: disk-redis-tls-proxy
        - name: redis-ca
          secret:
            secretName: disk-runtime-secrets
            defaultMode: 288
            items:
              - key: REDIS_CA_CERT
                path: ca.crt

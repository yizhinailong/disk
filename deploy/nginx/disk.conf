upstream disk_api {
    zone disk_api 64k;
    least_conn;
    server api-a:8080 max_fails=2 fail_timeout=5s;
    server api-b:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;
    client_body_timeout 60s;

    location / {
        proxy_pass http://disk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;

        # Nginx does not retry a request after sending a non-idempotent body unless
        # proxy_next_upstream includes "non_idempotent", which is intentionally absent.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

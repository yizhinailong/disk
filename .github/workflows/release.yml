name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Backend Release Build ───────────────────────────────────────────
  build-backend:
    name: Build Backend (Linux Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXX: clang++-21
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      JWT_SECRET: "ci-jwt-secret-for-testing-only-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install CMake
        uses: lukka/get-cmake@v4

      - name: Install Ninja and ccache
        run: sudo apt-get install -y ninja-build ccache

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build/linux-release-clang/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure
        run: cmake --preset linux-release-clang

      - name: Build
        run: cmake --build --preset linux-release-clang

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: disk-backend-linux
          path: build/linux-release-clang/src/disk

  # ── Desktop Release Build ───────────────────────────────────────────
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: disk-desktop-linux
          - os: windows-2022
            artifact_name: disk-desktop-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
          modules: >-
            qtbase qtdeclarative qtsvg qtshadertools qtquickcontrols2
            qtimageformats qtwaylandcompositor qt5compat linguist

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure
        run: cmake -S clients/desktop -B clients/desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build clients/desktop/build --config Release

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            clients/desktop/build/disk-desktop
            clients/desktop/build/disk-desktop.exe
            clients/desktop/build/DiskDesktop/
          if-no-files-found: warn

  # ── Create GitHub Release ───────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-backend, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: disk-backend-linux
          path: artifacts/backend

      - name: Download desktop Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: disk-desktop-linux
          path: artifacts/desktop-linux

      - name: Download desktop Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: disk-desktop-windows
          path: artifacts/desktop-windows

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Artifacts
            - `disk-backend-linux` — Backend binary (Linux x64)
            - `disk-desktop-linux` — Desktop client (Linux)
            - `disk-desktop-windows` — Desktop client (Windows)
          files: |
            artifacts/backend/disk
            artifacts/desktop-linux/*
            artifacts/desktop-windows/*
          fail_on_unmatched_files: false

name: Bug report
description: Report a problem with the Disk cloud storage backend
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report bugs in Disk, a high-performance cloud storage backend built with C++23 and Drogon. Include enough detail for maintainers to reproduce and diagnose the issue.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: disk_version
    attributes:
      label: Disk version / commit
      description: Include the Disk version, Git commit, or branch name. For local builds, also include the build preset.
      placeholder: main @ 13fb2b4, linux-debug-clang
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the problem, reproduction steps, expected result, actual result, and any relevant logs, API requests, or test output.
      placeholder: |
        Short summary:
        When calling the ... API, ...

        Steps to reproduce:
        1. ...
        2. ...
        3. ...

        Expected result:

        Actual result:

        Relevant logs / requests / responses:
    validations:
      required: true

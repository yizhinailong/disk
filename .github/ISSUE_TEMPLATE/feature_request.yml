name: Feature request
description: Suggest a feature or improvement for the Disk cloud storage backend
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest new features, API capabilities, storage behavior, operations improvements, or developer experience changes for the Disk backend.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish? What is missing in the current authentication, file management, chunked upload, sharing, trash, operations API, or testing workflow?
      placeholder: It is hard to track progress when moving a large batch of files.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want to add or change. If it affects the API, include paths, request fields, response fields, or authentication requirements.
      placeholder: Add asynchronous batch operation tasks and expose progress plus failed items in a task detail endpoint.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Workarounds, related design docs, API examples, test cases, or performance and compatibility constraints.
    validations:
      required: false

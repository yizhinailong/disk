name: disk-distributed

x-disk-environment: &disk-environment
  DISK_CONFIG_FILE: /app/config.json
  DISK_LISTEN_ADDRESS: 0.0.0.0
  DISK_LISTEN_PORT: 8080
  DISK_STORAGE_BACKEND: s3
  DISK_UPLOAD_STAGING_BACKEND: ${DISK_UPLOAD_STAGING_BACKEND:-s3}
  DISK_UPLOAD_TASK_CREATION_ENABLED: ${DISK_UPLOAD_TASK_CREATION_ENABLED:-true}
  DISK_TRUSTED_PROXY_CIDRS: '["172.28.0.10"]'
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: disk
  DATABASE_USER: disk
  DATABASE_PASSWORD: ${DISK_DATABASE_PASSWORD:?set DISK_DATABASE_PASSWORD}
  DATABASE_POOL_SIZE: ${DISK_DATABASE_POOL_SIZE:-8}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${DISK_REDIS_PASSWORD:?set DISK_REDIS_PASSWORD}
  REDIS_POOL_SIZE: ${DISK_REDIS_POOL_SIZE:-4}
  JWT_SECRET: ${DISK_JWT_SECRET:?set DISK_JWT_SECRET}
  DISK_SECURE_MODE: "false"
  DISK_S3_BUCKET: disk
  DISK_S3_REGION: us-east-1
  DISK_S3_ENDPOINT: http://minio:9000
  DISK_S3_USE_SSL: "false"
  DISK_S3_FORCE_PATH_STYLE: "true"
  DISK_S3_VERIFY_SSL: "false"
  DISK_S3_OBJECT_PREFIX: objects
  DISK_S3_STAGING_PREFIX: staging
  DISK_S3_MAX_CONNECTIONS: ${DISK_S3_MAX_CONNECTIONS:-16}
  DISK_S3_IO_THREADS: ${DISK_S3_IO_THREADS:-4}
  DISK_S3_CONNECT_TIMEOUT_MS: ${DISK_S3_CONNECT_TIMEOUT_MS:-3000}
  DISK_S3_REQUEST_TIMEOUT_MS: ${DISK_S3_REQUEST_TIMEOUT_MS:-300000}
  DISK_S3_MAX_RETRIES: ${DISK_S3_MAX_RETRIES:-3}
  DISK_S3_RETRY_BASE_DELAY_MS: ${DISK_S3_RETRY_BASE_DELAY_MS:-100}
  DISK_S3_ACCESS_KEY: ${DISK_S3_ACCESS_KEY:?set DISK_S3_ACCESS_KEY}
  DISK_S3_SECRET_KEY: ${DISK_S3_SECRET_KEY:?set DISK_S3_SECRET_KEY}
  TZ: UTC

x-disk-service: &disk-service
  image: disk-distributed:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: ${DISK_STOP_GRACE_PERIOD:-40s}
  init: true
  environment:
    <<: *disk-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks:
    - disk-backend

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: disk
      POSTGRES_USER: disk
      POSTGRES_PASSWORD: ${DISK_DATABASE_PASSWORD:?set DISK_DATABASE_PASSWORD}
    command:
      - postgres
      - -c
      - statement_timeout=30s
      - -c
      - lock_timeout=5s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - max_connections=100
    ports:
      - "127.0.0.1:${DISK_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - disk-backend

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DISK_REDIS_PASSWORD:?set DISK_REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${DISK_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - disk-backend

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DISK_MINIO_ROOT_USER:-disk-local}
      MINIO_ROOT_PASSWORD: ${DISK_MINIO_ROOT_PASSWORD:?set DISK_MINIO_ROOT_PASSWORD}
      MINIO_API_STALE_UPLOADS_EXPIRY: 168h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - "127.0.0.1:${DISK_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${DISK_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - disk-backend

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${DISK_MINIO_ROOT_USER:-disk-local}
      MINIO_ROOT_PASSWORD: ${DISK_MINIO_ROOT_PASSWORD:?set DISK_MINIO_ROOT_PASSWORD}
      DISK_S3_BUCKET: disk
      DISK_S3_ACCESS_KEY: ${DISK_S3_ACCESS_KEY:?set DISK_S3_ACCESS_KEY}
      DISK_S3_SECRET_KEY: ${DISK_S3_SECRET_KEY:?set DISK_S3_SECRET_KEY}
      DISK_S3_MIGRATION_ACCESS_KEY: ${DISK_S3_MIGRATION_ACCESS_KEY:?set DISK_S3_MIGRATION_ACCESS_KEY}
      DISK_S3_MIGRATION_SECRET_KEY: ${DISK_S3_MIGRATION_SECRET_KEY:?set DISK_S3_MIGRATION_SECRET_KEY}
    entrypoint: ["/bin/sh", "/config/provision.sh"]
    volumes:
      - ./deploy/minio/lifecycle.json:/config/lifecycle.json:ro
      - ./deploy/minio/app-policy.json:/config/app-policy.json:ro
      - ./deploy/minio/migration-policy.json:/config/migration-policy.json:ro
      - ./deploy/minio/provision.sh:/config/provision.sh:ro
    networks:
      - disk-backend

  api-a:
    <<: *disk-service
    environment:
      <<: *disk-environment
      DISK_PROCESS_ROLE: api
      DISK_INSTANCE_ID: disk-api-a
    ports:
      - "127.0.0.1:${DISK_API_A_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  api-b:
    <<: *disk-service
    environment:
      <<: *disk-environment
      DISK_PROCESS_ROLE: api
      DISK_INSTANCE_ID: disk-api-b
    ports:
      - "127.0.0.1:${DISK_API_B_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  worker-a:
    <<: *disk-service
    environment:
      <<: *disk-environment
      DISK_PROCESS_ROLE: worker
      DISK_INSTANCE_ID: disk-worker-a
      DISK_WORKER_CLAIMING_ENABLED: ${DISK_WORKER_CLAIMING_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  worker-b:
    <<: *disk-service
    environment:
      <<: *disk-environment
      DISK_PROCESS_ROLE: worker
      DISK_INSTANCE_ID: disk-worker-b
      DISK_WORKER_CLAIMING_ENABLED: ${DISK_WORKER_CLAIMING_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  load-balancer:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DISK_LB_PORT:-18080}:8080"
    volumes:
      - ./deploy/nginx/disk.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/includes:/etc/nginx/disk:ro
      - ./deploy/nginx/upstreams/api-a-b.inc:/etc/nginx/conf.d/disk-api-upstreams.inc:ro
      - ./deploy/nginx/upload-mode/open.inc:/etc/nginx/conf.d/disk-upload-mode.inc:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      disk-backend:
        ipv4_address: 172.28.0.10

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  disk-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

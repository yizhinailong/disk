services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DISK_MINIO_ROOT_USER:-disk-root}
      MINIO_ROOT_PASSWORD: ${DISK_MINIO_ROOT_PASSWORD:-disk-root-password}
      MINIO_API_STALE_UPLOADS_EXPIRY: 168h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${DISK_MINIO_ROOT_USER:-disk-root}
      MINIO_ROOT_PASSWORD: ${DISK_MINIO_ROOT_PASSWORD:-disk-root-password}
      DISK_S3_BUCKET: disk
      DISK_S3_ACCESS_KEY: ${DISK_S3_ACCESS_KEY:-disk-app}
      DISK_S3_SECRET_KEY: ${DISK_S3_SECRET_KEY:-disk-app-password}
    entrypoint: ["/bin/sh", "/config/provision.sh"]
    volumes:
      - ./deploy/minio/lifecycle.json:/config/lifecycle.json:ro
      - ./deploy/minio/app-policy.json:/config/app-policy.json:ro
      - ./deploy/minio/provision.sh:/config/provision.sh:ro

volumes:
  minio-data:
